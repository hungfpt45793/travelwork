services:
  app8:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelwork-app8
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8014
      DB_HOST: mysql8
      DB_PORT: 3306
      DB_DATABASE: travelwork8
      DB_USERNAME: ${DB_USERNAME:-travelwork}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8014:8000"
    depends_on:
      mysql8:
        condition: service_healthy
    command: php -S 0.0.0.0:8000 -t public server.php

  mysql8:
    image: mysql:8.4
    command:
      - --max_allowed_packet=256M
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    container_name: travelwork-mysql8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: travelwork8
      MYSQL_USER: ${DB_USERNAME:-travelwork}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql8_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql8_data:
